[package]
name = "qudelix-widget"
version = "0.1.0"
edition = "2021"
description = "Desktop gadget to control a Qudelix 5K DAC/amp over Bluetooth (RFCOMM/GAIA)"
license = "MIT"
publish = false

[features]
default = ["ble"]
# Bluetooth: the RFCOMM/GAIA session (the real control path), the paired-device
# lookup and the old BLE GATT probe. On by default; the name is historical.
# Pulls the WinRT Bluetooth features of the `windows` crate and compiles `src/ble.rs`.
ble = [
    "windows/Foundation",
    "windows/Foundation_Collections",
    "windows/Devices_Bluetooth",
    "windows/Devices_Bluetooth_Advertisement",
    "windows/Devices_Bluetooth_GenericAttributeProfile",
    "windows/Devices_Enumeration",
    "windows/Storage_Streams",
    # Dropping / restoring this PC's Bluetooth audio link (btaudio.rs).
    "windows/Win32_Media_KernelStreaming",
]

[dependencies]
# Verifies the Ed25519 signature of a self-update download (release.rs).
# Pure Rust; verification only, so no RNG / PEM features.
ed25519-compact = { version = "2.6", default-features = false, features = ["std"] }

# Windows-only dependencies: the host build (for `cargo test` of the protocol
# core) needs none of this.
[target.'cfg(windows)'.dependencies]
hidapi = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_GdiPlus",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Bluetooth",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    # Sound output picker (audio_out.rs); also used by btaudio.rs.
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
]

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
